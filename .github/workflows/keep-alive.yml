name: Keep Alive Render 24/7

on:
  schedule:
    # Trigger every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web Service
        run: |
          URL="https://auto-quest-discord.onrender.com"
          echo "Sending Keep-Alive Ping to $URL..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo "000")
          echo "Response HTTP Status: $STATUS"
